<!DOCTYPE html>
<html lang="en" data-theme="black" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Anything</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=K2D:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ──────────────────────────────────────────
       THEMES
       ────────────────────────────────────────── */
    [data-theme="black"][data-mode="dark"]  { --bg:#2b2b2b; --fg:#d1d0c5; --dim:#646669; --ac:#e2b714; --s1:rgba(255,255,255,.05); --s2:rgba(255,255,255,.10); }
    [data-theme="black"][data-mode="light"] { --bg:#f5f5f0; --fg:#2c2c2c; --dim:#9a9a9a; --ac:#b38f00; --s1:rgba(0,0,0,.04);       --s2:rgba(0,0,0,.10); }

    [data-theme="sepia"][data-mode="dark"]  { --bg:#1c1510; --fg:#dfc9a2; --dim:#6b5030; --ac:#d4943a; --s1:rgba(223,201,162,.05); --s2:rgba(223,201,162,.12); }
    [data-theme="sepia"][data-mode="light"] { --bg:#f6f1e8; --fg:#3a2410; --dim:#c0a070; --ac:#9a6020; --s1:rgba(58,36,16,.04);    --s2:rgba(58,36,16,.12); }

    [data-theme="navy"][data-mode="dark"]   { --bg:#0e1221; --fg:#b8cce0; --dim:#2e3e5e; --ac:#5b9bd5; --s1:rgba(184,204,224,.05); --s2:rgba(184,204,224,.12); }
    [data-theme="navy"][data-mode="light"]  { --bg:#e8eef8; --fg:#0c1e38; --dim:#7090c0; --ac:#2060c8; --s1:rgba(12,30,56,.04);    --s2:rgba(12,30,56,.12); }

    /* ──────────────────────────────────────────
       BASE
       ────────────────────────────────────────── */
    :root {
      --lh:  1.75;
      --dur: 0.2s;
      --hdr: 54px;
      --mono: 'JetBrains Mono', 'Courier New', monospace;
      /* content column: matches monkeytype proportions (~90 vw) */
      --pad-x: 20vw;
    }

    html { height: 100%; }

    body {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      transition: background var(--dur), color var(--dur);
      overflow: hidden;
    }

    ::selection { background: var(--ac); color: var(--bg); }

    /* ──────────────────────────────────────────
       CONTENT COLUMN — same width for header + editor
       ────────────────────────────────────────── */
    .col {
      width: 100%;
      padding-left: var(--pad-x);
      padding-right: var(--pad-x);
    }

    /* ──────────────────────────────────────────
       HEADER
       ────────────────────────────────────────── */
    header {
      flex-shrink: 0;
      height: var(--hdr);
      display: flex;
      align-items: center;
    }

    /* header inner: logo LEFT, toolbar CENTRE */
    .hcol {
      width: 100%;
      padding-left: var(--pad-x);
      padding-right: var(--pad-x);
      display: flex;
      align-items: center;
      position: relative;   /* toolbar absolute-centres against this */
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      user-select: none;
      color: inherit;
      flex-shrink: 0;
      z-index: 1;           /* keep above absolutely-positioned toolbar */
    }

    .logo-icon { width: 26px; height: 26px; flex-shrink: 0; }

    .logo-text {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--dim);
      letter-spacing: 0.01em;
      transition: color var(--dur);
    }

    /* ── Toolbar (true horizontal centre of header) ── */
    .toolbar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.45rem;          /* gap between bordered groups */
    }

    /* ── Tool group — bordered pill ── */
    .tg {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--s1);
      border: 1px solid var(--s2);
      border-radius: 8px;
      padding: 0.18rem 0.45rem;
    }

    /* tool label */
    .tl {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--dim);
      padding-right: 0.3rem;
      letter-spacing: 0.07em;
      opacity: 0.55;
      user-select: none;
      pointer-events: none;
    }

    /* tool button */
    .tb {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 400;
      padding: 0.22rem 0.45rem;
      border: none;
      background: none;
      color: var(--dim);
      cursor: pointer;
      letter-spacing: 0.025em;
      border-radius: 5px;
      transition: color var(--dur);
      white-space: nowrap;
    }
    .tb:hover { color: var(--fg); }
    .tb.on    { color: var(--ac); }

    /* count value */
    #count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ac);
      padding: 0.22rem 0.3rem;
      min-width: 4ch;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    /* ──────────────────────────────────────────
       MAIN — editor vertically centered
       ────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* ──────────────────────────────────────────
       EDITOR
       ────────────────────────────────────────── */
    #editor {
      display: block;
      width: 100%;
      /* max 10 lines tall; shrink if not enough viewport room */
      height: calc(10 * var(--lh) * 1em);
      max-height: calc(100vh - var(--hdr) - 4rem);
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--fg);
      font-family: 'K2D', system-ui, -apple-system, sans-serif;
      font-size: 2rem;          /* overridden by JS */
      font-weight: 300;
      line-height: var(--lh);
      letter-spacing: -0.015em;
      caret-color: var(--ac);
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      transition: color var(--dur), background var(--dur), font-size 0.15s ease;
      opacity: 0;
      animation: fade-in 0.4s 0.08s ease forwards;
    }
    #editor::-webkit-scrollbar { display: none; }
    #editor::placeholder {
      color: var(--dim);
      font-style: italic;
      opacity: 0.45;
    }

    @keyframes fade-in { to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- ════════════════════════════════════════
       HEADER
       ════════════════════════════════════════ -->
  <header>
    <div class="hcol">

      <!-- Logo (left) -->
      <a class="logo" href="#" onclick="return false;" tabindex="-1">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="6" width="26" height="23" rx="5" fill="var(--ac)" opacity="0.3"/>
          <rect x="3" y="3" width="26" height="23" rx="5" fill="var(--ac)"/>
          <rect x="6" y="6" width="20" height="14" rx="2.5" fill="var(--bg)" opacity="0.2"/>
          <text
            x="16" y="18.5"
            text-anchor="middle"
            font-family="'JetBrains Mono', monospace"
            font-size="12"
            font-weight="700"
            fill="var(--bg)"
          >A</text>
        </svg>
        <span class="logo-text">type anything</span>
      </a>

      <!-- Toolbar (centred absolutely within .hcol) -->
      <nav class="toolbar" id="toolbar">

        <!-- Size -->
        <div class="tg">
          <span class="tl">size</span>
          <button class="tb on" data-act="size" data-val="small">small</button>
          <button class="tb"    data-act="size" data-val="medium">medium</button>
          <button class="tb"    data-act="size" data-val="large">large</button>
        </div>

        <!-- Theme -->
        <div class="tg">
          <span class="tl">theme</span>
          <button class="tb on" data-act="theme" data-val="black">ink</button>
          <button class="tb"    data-act="theme" data-val="sepia">sepia</button>
          <button class="tb"    data-act="theme" data-val="navy">navy</button>
        </div>

        <!-- Mode -->
        <div class="tg">
          <button class="tb on" data-act="mode" data-val="dark">dark</button>
          <button class="tb"    data-act="mode" data-val="light">light</button>
        </div>

        <!-- Count -->
        <div class="tg">
          <span class="tl">count</span>
          <span id="count">0</span>
        </div>

      </nav>

    </div>
  </header>

  <!-- ════════════════════════════════════════
       EDITOR — centred in remaining space
       ════════════════════════════════════════ -->
  <main>
    <div class="col">
      <textarea
        id="editor"
        placeholder="start typing…"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const root = document.documentElement;
    const ed   = $('editor');

    const S_TEXT = 'type_text';
    const S_PREF = 'type_pref';

    /* size → font-size in rem */
    const SIZES = { small: 2, medium: 3.25, large: 5 };
    let currentSize = 'small';

    /* ═══════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════ */
    function init() {
      ed.value = localStorage.getItem(S_TEXT) || '';
      updateCount();

      try {
        const p = JSON.parse(localStorage.getItem(S_PREF) || '{}');
        if (p.theme && ['black','sepia','navy'].includes(p.theme)) {
          root.dataset.theme = p.theme;
          syncGroup('theme', p.theme);
        }
        if (p.mode && ['dark','light'].includes(p.mode)) {
          root.dataset.mode = p.mode;
          syncGroup('mode', p.mode);
        }
        if (p.size && SIZES[p.size]) {
          currentSize = p.size;
          syncGroup('size', p.size);
        }
      } catch { /* ignore */ }

      applySize(currentSize);
      ed.focus();
    }

    function savePrefs() {
      localStorage.setItem(S_PREF, JSON.stringify({
        theme: root.dataset.theme,
        mode:  root.dataset.mode,
        size:  currentSize,
      }));
    }

    /* ═══════════════════════════════════════════
       COUNT
       ═══════════════════════════════════════════ */
    function updateCount() {
      $('count').textContent = ed.value.length;
    }

    ed.addEventListener('input', () => {
      localStorage.setItem(S_TEXT, ed.value);
      updateCount();
    });

    /* ═══════════════════════════════════════════
       SIZE
       ═══════════════════════════════════════════ */
    function applySize(name) {
      ed.style.fontSize = (SIZES[name] ?? SIZES.small) + 'rem';
    }

    /* ═══════════════════════════════════════════
       TOOLBAR
       ═══════════════════════════════════════════ */
    function syncGroup(act, val) {
      document.querySelectorAll(`[data-act="${act}"]`).forEach(btn =>
        btn.classList.toggle('on', btn.dataset.val === val)
      );
    }

    $('toolbar').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const { act, val } = btn.dataset;

      if      (act === 'size')  { currentSize = val; applySize(val); }
      else if (act === 'theme') { root.dataset.theme = val; }
      else if (act === 'mode')  { root.dataset.mode  = val; }

      syncGroup(act, val);
      savePrefs();
    });

    /* ═══════════════════════════════════════════
       START
       ═══════════════════════════════════════════ */
    init();
  </script>
</body>
</html>
